    <div id="modelBox"></div>
  </div>`;
  const upd = ()=>{ const all = document.querySelectorAll(".ck"), n = [...all].filter(c=>c.checked).length; $("#ckCount").textContent = "Marcaste " + n + " de " + all.length + (n===all.length ? " ¡Perfecto! 🌟" : ""); };
  document.querySelectorAll(".ck").forEach(c=>c.addEventListener("change", upd)); upd();
  $("#btnModel").onclick = ()=>{
    $("#modelBox").innerHTML = '<h3>🌟 Ejemplo modelo</h3><div class="model">' + w.model + '</div><p class="small muted">No tiene que ser igual al tuyo: compara si el tuyo tiene las mismas partes.</p><div class="row"><button class="btn secondary" onclick="window.scrollTo(0,0)">⬆️ Mejorar mi texto</button>' + (nextWriteId(w.id) ? '<button class="btn" onclick="curWrite=\'' + nextWriteId(w.id) + '\';renderWrite();window.scrollTo(0,0)">Siguiente actividad ➡️</button>' : '<button class="btn green" onclick="goHome()">🗺️ Volver al mapa</button>') + '</div>';
    if(!S.writeDone[w.id]){
      S.writeDone[w.id] = true; save(); addPoints(30);
      if(WRITES.every(x=>S.writeDone[x.id])){ markDone("m5"); giveMedal("m5"); }
    }
  };
  $("#wcheck").scrollIntoView({behavior:"smooth"});
}
function nextWriteId(id){ const i = WRITES.findIndex(x=>x.id===id); return WRITES[i+1] ? WRITES[i+1].id : null; }

/* =========================================================
   PRUEBA FINAL
   ========================================================= */
let timerId = null, timerSec = 0;
function startTimer(){ stopTimer(); timerId = setInterval(()=>{ timerSec++; drawTimer(); }, 1000); }
function stopTimer(){ if(timerId) clearInterval(timerId); timerId = null; }
function drawTimer(){
  const t = document.getElementById("timer"); if(!t) return;
  const mm = String(Math.floor(timerSec/60)).padStart(2,"0"), ss = String(timerSec%60).padStart(2,"0");
  t.textContent = "⏱️ " + mm + ":" + ss;
  t.style.display = S.timerOn ? "" : "none";
}
function toggleTimer(){
  S.timerOn = !S.timerOn; save();
  if(S.timerOn) startTimer(); else stopTimer();
  drawTimer();
  const b = document.getElementById("timerBtn"); if(b) b.textContent = S.timerOn ? "⏸️ Apagar cronómetro" : "▶️ Encender cronómetro";
}
function calcGrade(p, max){
  const e = 0.6 * max;
  const n = p < e ? 1 + 3 * p / e : 4 + 3 * (p - e) / (max - e);
  return Math.round(n * 10) / 10;
}
function fmtGrade(n){ return n.toFixed(1).replace(".", ","); }
function openFinal(){ show("screen-final"); renderFinalIntro(); }
function renderFinalIntro(){
  $("#final").innerHTML = `<div class="c-fin">
    <div class="mhead"><span class="micon">📝</span><div><div class="small muted">Simulacro</div><h1>Prueba final</h1></div></div>
    <div class="card">
      <h2>¿Cómo funciona?</h2>
      <ul class="feat">
        <li>📋 <b>20 preguntas</b> de todos los temas, como en una prueba del colegio.</li>
        <li>🤫 No verás si está bien o mal hasta el final (¡como en la prueba de verdad!).</li>
        <li>📊 Al final: tu <b>nota del 1,0 al 7,0</b> (con 12 buenas sacas un 4,0), tus errores explicados y qué misión repasar.</li>
        <li>⏱️ Cronómetro opcional: lo puedes apagar cuando quieras.</li>
        <li>🔀 Cada vez salen preguntas distintas y en otro orden (hay ${FINAL_BANK.length} en el banco).</li>
      </ul>
      <p>🏆 Con nota <b>6,0 o más</b> ganas la medalla <b>${MEDALS.final.name}</b>.</p>
      <div class="row center"><button class="btn" onclick="startFinal()">¡Comenzar prueba! 📝</button></div>
    </div></div>`;
}
function startFinal(){
  // 5 preguntas de cada misión (m1, m2, m3, m4) mezcladas
  let qs = [];
  ["m1","m2","m3","m4"].forEach(t=>{ qs = qs.concat(shuffle(FINAL_BANK.filter(q=>q.tag===t)).slice(0,5)); });
  qs = shuffle(qs);
  const answers = [];
  let i = 0;
  timerSec = 0;
  const step = ()=>{
    if(i >= qs.length){ stopTimer(); return endFinal(qs, answers); }
    $("#final").innerHTML = `<div class="c-fin">
      <div class="qhead"><span>📝 Pregunta ${i+1} de ${qs.length}</span>
      <span class="row"><span class="timer" id="timer"></span><button class="linkbtn" id="timerBtn" onclick="toggleTimer()">${S.timerOn ? "⏸️ Apagar cronómetro" : "▶️ Encender cronómetro"}</button></span></div>
      <div class="progress thin"><div style="width:${Math.round(i/qs.length*100)}%"></div></div>
      <div id="qbox"></div>
      <div class="center"><button class="linkbtn" onclick="if(confirm('¿Salir de la prueba? Perderás las respuestas.')) goHome()">Salir de la prueba</button></div></div>`;
    drawTimer();
    renderQuestion(qs[i], $("#qbox"), "exam", {
      onAnswer(ok, first, given){ answers.push({q:qs[i], ok, given}); },
      onNext(){ i++; step(); window.scrollTo(0,0); }
    });
  };
  step();
  if(S.timerOn) startTimer();
}
function endFinal(qs, answers){
  const correct = answers.filter(a=>a.ok).length;
  const grade = calcGrade(correct, qs.length);
  S.lastGrade = grade;
  if(S.bestGrade == null || grade > S.bestGrade) S.bestGrade = grade;
  save();
  markDone("final");
  addPoints(correct * 5);
  const mm = Math.floor(timerSec/60), ss = timerSec % 60;
  const wrongs = answers.filter(a=>!a.ok);
  const names = {m1:"Misión 1: Reportaje", m2:"Misión 2: Artículo informativo", m3:"Misión 3: Manual de instrucciones", m4:"Misión 4: ¿Qué texto es?"};
  const cnt = {}; wrongs.forEach(a=>{ cnt[a.q.tag] = (cnt[a.q.tag]||0) + 1; });
  const ranked = Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  let rec;
  if(!ranked.length) rec = "<p class='big'>🌟 ¡No tuviste errores! Estás listo. Solo repasa la Hoja resumen el martes.</p>";
  else {
    const go = {m1:"openMission('m1','learn')", m2:"openMission('m2','learn')", m3:"openMission('m3','learn')", m4:"openCompare()"};
    rec = "<p>Te conviene repasar:</p><div class='row'>" + ranked.map(t=>'<button class="btn secondary" onclick="' + go[t] + '">' + names[t] + ' (' + cnt[t] + ' error' + (cnt[t]>1 ? "es" : "") + ')</button>').join("") + "</div>";
  }
  const msg = grade >= 6 ? "¡Excelente! 🌟 Estás muy bien preparado." : grade >= 5 ? "¡Muy bien! 👍 Repasa tus errores y estarás listo." : grade >= 4 ? "¡Aprobado! 💪 Con un poco más de repaso subirás tu nota." : "¡No te desanimes! 🌱 Repasa las misiones sugeridas y vuelve a intentarlo.";
  const revs = wrongs.map(a=>{
    const n = qs.indexOf(a.q) + 1;
    return '<div class="rev"><div class="revq">Pregunta ' + n + ': ' + strip(a.q.q) + '</div>'
      + '<div>❌ <b>Tu respuesta:</b> ' + a.given + '</div>'
      + '<div>✅ <b>Respuesta correcta:</b><br>' + correctText(a.q) + '</div>'
      + '<div class="fix">💬 ' + a.q.exp + '</div>'
      + '<div class="small muted">📌 Tema: ' + names[a.q.tag] + '</div></div>';
  }).join("");
  $("#final").innerHTML = `<div class="c-fin">
    <div class="card center">
      <h2>📊 Resultado de tu prueba</h2>
      <div class="grade ${grade >= 4 ? "pass" : "fail"}">${fmtGrade(grade)}</div>
      <p class="big">Respuestas correctas: <b>${correct} de ${qs.length}</b></p>
      <p>${msg}</p>
      <p class="small muted">⏱️ Tiempo: ${mm} min ${ss} s ${S.timerOn ? "" : "(cronómetro apagado en algún momento)"} · +${correct*5} ⭐ · Mejor nota: ${fmtGrade(S.bestGrade)}</p>
      <div class="row center"><button class="btn" onclick="startFinal()">🔁 Repetir prueba (otras preguntas)</button><button class="btn secondary" onclick="goHome()">🗺️ Volver al mapa</button></div>
    </div>
    <div class="card"><h2>🎯 ¿Qué repasar?</h2>${rec}</div>
    ${wrongs.length ? '<div class="card"><h2>❌ Preguntas que tuviste malas (' + wrongs.length + ')</h2>' + revs + '</div>' : ""}
  </div>`;
  if(grade >= 6) giveMedal("final");
}

      <div class="sum-trick"><h4>🧠 Truco</h4><p>🚲 <b>T</b>u <b>B</b>ici <b>L</b>leva <b>C</b>adena y <b>C</b>asco</p><p>🕵️ El reportero investiga como detective.</p></div>
    </div></div>

      <div class="sum-trick"><h4>🧠 Truco</h4><p>🧪 <b>T</b>engo <b>I</b>deas <b>D</b>e <b>C</b>ientífico</p><p>🔬 Explica, pero NO opina.</p></div>
    </div></div>

    <div class="sum-box c-man"><h2>🛠️ Manual de instrucciones (texto instructivo)</h2><div class="sum-grid">
      <div><h4>🎯 Propósito</h4><p><b>Enseñar a hacer o usar algo paso a paso.</b></p></div>
      <div><h4>🧩 Partes</h4><ol><li>Título u objetivo</li><li>Materiales o componentes</li><li>Pasos numerados y en orden</li><li>Imágenes de apoyo</li><li>Advertencias ⚠️</li></ol></div>
      <div><h4>✨ Características</h4><ul><li>Lenguaje claro, preciso y breve</li><li>Verbos en imperativo (corta) o infinitivo (cortar)</li><li>Conectores de orden: primero, luego, después, finalmente</li><li>Está en recetas, juguetes y aparatos</li></ul></div>
      <div class="sum-trick"><h4>🧠 Truco</h4><p>¿QUÉ? ¿CON QUÉ? ¿CÓMO? ¡CUIDADO!</p><p>🎵 Primero, luego y al final: ¡así se sigue un manual!</p></div>

}
